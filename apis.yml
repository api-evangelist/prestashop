apis:
- name: PrestaShop Webservice API
  description: 'The PrestaShop Webservice API enables third-party applications to
    access and manage shop data through CRUD operations on 60+ resources including
    products, categories, orders, customers, carriers, stock movements, invoices,
    tax rules, and more. Authentication uses HTTP Basic Auth with a store-generated
    API key.

    '
  image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
  humanURL: https://devdocs.prestashop-project.org/9/webservice/
