aid: prestashop
name: PrestaShop
description: 'PrestaShop is an open-source e-commerce platform with a REST API for
  managing products, categories, orders, customers, carriers, stock, and tax rules
  for online stores. The Webservice API provides full CRUD access to 60+ shop resources
  using HTTP Basic authentication, while the newer Admin API supports OAuth 2.0 client
  credentials for programmatic store management.

  '
