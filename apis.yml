- name: PrestaShop Admin API
  description: 'The PrestaShop Admin API is a modern REST API introduced in PrestaShop
    9 based on API Platform framework using CQRS patterns. It supports OAuth 2.0 client
    credentials authentication and provides access to administrative endpoints for
    managing store configuration, products, orders, and other domain resources.

    '
